name: auto-open

# 장중 자동 매매: 개장 후(ET 10:00 이후) 한 번 판단 + 같은 실행에서 체결. 가상 거래 전용.
#  - 지표는 직전 거래일 종가까지의 일봉(오늘 진행 중인 봉은 제외), 오늘 현재가는 따로 전달.
#  - GitHub 예약 실행은 수 시간 늦어질 수 있어 14:05~19:35 UTC 30분마다 시도한다
#    (겨울 개장 14:30 UTC / 여름 13:30 UTC, 마감 21:00 / 20:00 UTC).
#    정규장이 아니거나 10:00 ET 이전이거나 오늘 이미 판단했으면 아무것도 하지 않는다(멱등).
on:
  schedule:
    - cron: "5,35 14-19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 장중 매매 판단 (Gemini → 규칙 검증 → paper/orders.json)
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::warning::GEMINI_API_KEY 없음 — 건너뜀"; exit 0; fi
          python -I -u scripts/gemini_trader.py --live
      - name: 대기 주문 체결 (실제 시세)
        run: python -I paper/sim.py exec-orders --same-day
      - name: 커밋 & 푸시
        run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add paper docs/paper
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: $(date -u +%F) intraday decision + execution"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
