name: auto-open

# 평일 14:05~19:35 UTC 30분마다 시도(겨울 개장 14:30 UTC, 여름 13:30 UTC; 마감 21:00/20:00 UTC).
# GitHub 예약 실행은 수 시간 늦어질 수 있어(11/13 은 15:00 → 21:03 UTC 로 밀려 장이 닫힌 뒤 실행됨) 여러 번 시도한다.
# 정규장이 아니거나 대기 주문이 없으면 아무것도 하지 않고, 체결된 주문은 다시 체결되지 않는다(멱등).
# 전날 마감 후 만들어 둔 paper/orders.json 의 대기 주문을
# 실제 시세로 체결한다(기준가 ±3% 초과 매수는 취소, 한도 규칙은 sim.py 가 강제). 가상 거래 전용.
on:
  schedule:
    - cron: "5,35 14-19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 대기 주문 체결
        run: python -I paper/sim.py exec-orders
      - name: 커밋 & 푸시
        run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add paper docs/paper
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: $(date -u +%F) open-session order execution"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
