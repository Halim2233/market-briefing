name: auto-daily

# 평일 미국 정규장 마감 후 자동 실행: UTC 21:30 = KST 06:30 = ET 16:30(겨울)/17:30(여름) → 항상 마감 이후.
# 하는 일: 수집 → (Gemini) 브리핑 생성 → 모의투자 평가·손절/목표가 규칙 점검·일일 기록 → 커밋/푸시.
# 하지 않는 일: 신규 매수/매도 판단 (사용자와 세션에서 결정).
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      briefing_test:
        description: "ping=연결만 시험, true면 브리핑을 reports에 저장하지 않고 아티팩트로만 만든다(Gemini 시험용)"
        default: "false"


permissions:
  contents: write

concurrency:
  group: auto-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 표준 라이브러리만 사용 — pip install 불필요

      - name: 데이터 수집 (시세·지표·뉴스)
        run: python -I scripts/collect.py

      - name: 브리핑 생성 (Gemini) — 실패해도 모의투자 점검은 계속
        id: briefing
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY 시크릿이 없어 브리핑 생성을 건너뜁니다."
            exit 0
          fi
          if [ "${{ inputs.briefing_test }}" = "ping" ]; then
            python -I -u scripts/gemini_briefing.py --ping
          elif [ "${{ inputs.briefing_test }}" = "true" ]; then
            mkdir -p test_out
            python -I -u scripts/gemini_briefing.py --out=test_out/briefing-test.md
          else
            python -I -u scripts/gemini_briefing.py
          fi

      - name: 시험 브리핑 아티팩트 업로드
        if: ${{ inputs.briefing_test == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: briefing-test
          path: test_out/

      - name: 모의투자 마감 점검 (평가 · 손절/목표가 규칙 · 일일 기록)
        run: python -I paper/sim.py autorun

      - name: 커밋 & 푸시
        run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add docs/reports paper docs/paper
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: $(date -u +%F) briefing + paper-trading check"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
