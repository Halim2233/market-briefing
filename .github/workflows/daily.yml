name: daily-briefing

on:
  schedule:
    - cron: "30 21 * * 1-5"   # UTC 21:30 = KST 06:30 (미장 마감 후, 월~금 기준 화~토 아침)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - name: Check Claude auth (토큰 값은 출력하지 않음)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 이 비어 있음 (시크릿 이름/위치 확인)"
          else
            echo "token set, length=${#CLAUDE_CODE_OAUTH_TOKEN}"
          fi
          claude --version
          claude auth status || true
          echo "--- test 1: 최소 호출"
          echo "Reply with exactly: OK" | claude -p --model sonnet 2>&1 | head -c 300; echo " [exit=${PIPESTATUS[1]}]"
          echo "--- test 2: 현재 파이프라인과 같은 옵션"
          echo "Reply with exactly: OK" | claude -p --model sonnet --system-prompt "You are a test." --tools "" --max-turns 1 --output-format text 2>&1 | head -c 300; echo " [exit=${PIPESTATUS[1]}]"
      - run: python src/main.py
        env:
          # 구독 토큰: 로컬에서 `claude setup-token`으로 발급 (API 과금 없이 구독 사용량 사용)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Commit report
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/reports
          git diff --cached --quiet || git commit -m "report: $(date -u +%F)"
          git push
