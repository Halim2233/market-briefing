name: daily-briefing

on:
  schedule:
    - cron: "30 21 * * 1-5"   # UTC 21:30 = KST 06:30 (미장 마감 후, 월~금 기준 화~토 아침)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - run: python src/main.py
        env:
          # 구독 토큰: 로컬에서 `claude setup-token`으로 발급 (API 과금 없이 구독 사용량 사용)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Commit report
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/reports
          git diff --cached --quiet || git commit -m "report: $(date -u +%F)"
          git push
