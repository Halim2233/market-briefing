<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title and page.layout != 'home' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>US Market Briefing</a>
      <span class="tag">NASDAQ · SEMIS</span>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap foot">
    Claude가 수집 자료로 작성한 문서이며 <strong>투자 권유가 아닙니다.</strong> 투자 판단과 책임은 본인에게 있습니다.
  </footer>

  <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
</body>
</html>
